packages:
  - "."

# Harden installs against brand-new / downgraded package publishes.
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# Direct deps / trusted scopes we pin deliberately before the 7-day window.
minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - eslint-config-next
  - react
  - react-dom
  - radix-ui
  - "@radix-ui/*"
  - lucide-react
  - postcss
  - brace-expansion

# pnpm 11+ reads overrides here (not package.json "pnpm" field).
overrides:
  "@babel/core": ">=7.29.6"
  "ajv@<6.14.0": "6.14.0"
  "brace-expansion@<2": "1.1.16"
  "brace-expansion@>=2 <5": "2.1.2"
  "brace-expansion@>=5": "5.0.8"
  "eslint-import-resolver-typescript": "4.4.5"
  "flatted": ">=3.4.0"
  "minimatch@<3.1.5": "3.1.5"
  "minimatch@>=9 <9.0.7": "9.0.9"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4 <4.0.4": "4.0.5"
  "postcss@<8.5.10": "8.5.23"
  "semver@<7": "7.8.5"
  "sharp": ">=0.35.0"

allowBuilds:
  unrs-resolver: true
